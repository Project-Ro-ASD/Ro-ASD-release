name: Fedora 44 RPM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:c64fc79f4a12dd4625d8cba9f7d242ac17c823bdeecc6d650234ebbf5f0ca81b
    steps:
      - name: Install build dependencies
        run: dnf --assumeyes --setopt=install_weak_deps=False install git rpm-build python3 tar gzip findutils coreutils

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and verify RPM output
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/build-rpm.sh
          ./scripts/verify-build.py dist

      - name: Upload CI evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ro-asd-release-fedora-44-${{ github.sha }}
          path: |
            dist/*.rpm
            dist/SHA256SUMS
            dist/component-artifact-manifest-v1.json
          if-no-files-found: error
          retention-days: 14
