name: Fedora 44 RPM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:c64fc79f4a12dd4625d8cba9f7d242ac17c823bdeecc6d650234ebbf5f0ca81b
    steps:
      - name: Install build dependencies
        run: dnf --assumeyes --setopt=install_weak_deps=False install git rpm-build python3 tar gzip findutils coreutils

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify RPM output
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/build-rpm.sh
          ./scripts/verify-build.py dist

      - name: Upload CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ro-asd-release-fedora-44-${{ github.sha }}
          path: |
            dist/*.rpm
            dist/SHA256SUMS
            dist/build-manifest-v1.json
          if-no-files-found: error
          retention-days: 14


  build-keyring:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: registry.fedoraproject.org/fedora:44@sha256:c64fc79f4a12dd4625d8cba9f7d242ac17c823bdeecc6d650234ebbf5f0ca81b
    steps:
      - name: Install build dependencies
        run: dnf --assumeyes --setopt=install_weak_deps=False install git rpm-build python3 tar gzip findutils coreutils gnupg2

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and verify keyring RPM output
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash ./scripts/build-keyring-rpm.sh
          python3 ./scripts/verify-build.py dist --component ro-asd-keyring

      - name: Upload keyring CI evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ro-asd-keyring-fedora-44-${{ github.sha }}
          path: |
            dist/*.rpm
            dist/SHA256SUMS
            dist/build-manifest-v1.json
          if-no-files-found: error
          retention-days: 14


